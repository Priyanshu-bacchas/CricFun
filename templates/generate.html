<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CricFun | Match Overlay</title><style>body{margin:0;background:#0a1020;color:#f4f7ff;font:16px/1.5 Segoe UI,Arial}main{max-width:900px;margin:55px auto;padding:25px}.brand{color:#fff;font-size:25px;font-weight:900;text-decoration:none}.brand span{color:#ffc83d}.panel{margin-top:30px;background:#141f33;border:1px solid #30415f;border-radius:16px;padding:28px}.muted{color:#a7b5ca}.url{display:flex;gap:10px;margin-top:20px}.url input{flex:1;min-width:0;background:#080e1b;color:#9ff9eb;border:1px solid #40516c;border-radius:8px;padding:13px;font-size:14px}.btn{background:#8e24aa;color:white;border:0;border-radius:8px;padding:13px 18px;font-weight:800;cursor:pointer}.back{color:#9ff9eb}@media(max-width:600px){.url{flex-direction:column}}</style></head><body><main><a class="brand" href="/">CRIC<span>FUN</span></a><section class="panel"><div class="muted">{{ match.series }} • {{ match.status }}</div><h1>{{ match.title }}</h1><h3>OBS Browser Source Link</h3><p class="muted">Copy this unique URL and paste it into OBS → Sources → Browser.</p><div class="url"><input id="overlayUrl" readonly value="{{ request.url_root.rstrip('/') }}/overlay/{{ match.id }}"><button class="btn" onclick="copyLink()">COPY LINK</button></div><p id="copied"></p><p class="muted">Recommended Browser Source size: 1920 × 1080. Overlay refresh interval: 3 seconds.</p><a class="back" href="/">← Back to matches</a></section></main><script>function copyLink(){const i=document.getElementById('overlayUrl');i.select();navigator.clipboard.writeText(i.value).then(()=>document.getElementById('copied').textContent='Overlay link copied.').catch(()=>document.getElementById('copied').textContent='Select and copy the URL manually.');}</script></body></html>
