<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CricFun Admin</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071326,#16345b);font:15px Arial;color:#fff}.box{width:min(420px,92vw);padding:32px;background:#13233b;border:1px solid #315078;border-radius:18px;box-shadow:0 20px 70px #0007}.brand{font-size:28px;font-weight:900}.brand span{color:#ffd34d}.sub{color:#9db6d6;margin:7px 0 25px}label{display:block;margin:14px 0 6px;color:#c5d6eb;font-weight:700}input{width:100%;padding:13px;border-radius:8px;border:1px solid #45617f;background:#091629;color:#fff}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:8px;background:linear-gradient(90deg,#8c27bd,#315ce4);color:white;font-weight:900;cursor:pointer}.msg{padding:10px;border-radius:7px;background:#5a2731;color:#ffd6dc;margin:10px 0}</style></head><body><form class="box" method="post"><div class="brand">CRIC<span>FUN</span></div><div class="sub">OBS Scoreboard Control Room</div>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="msg">{{m}}</div>{% endfor %}{% endwith %}<label>Username</label><input name="username" value="admin" required><label>Password</label><input name="password" type="password" required><button>LOGIN TO ADMIN</button></form></body></html>
