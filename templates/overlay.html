<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CricFun Scoreboard</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:white;font-family:Impact,'Arial Narrow',Arial,sans-serif}.stage{width:100vw;height:100vh;padding:1.2%;display:grid;grid-template-rows:18% 9% 1fr 16%;gap:1%;background:linear-gradient(135deg,#06152cdd,#06152c99)}.header{display:grid;grid-template-columns:1fr .48fr 1fr;gap:1%}.team,.middle,.panel{border:2px solid #268bff;border-radius:12px;background:linear-gradient(135deg,#071d42ee,#123c78ee);box-shadow:0 0 16px #147bff66;padding:1.2%;display:flex;flex-direction:column;justify-content:center;text-align:center}.team h1{font-size:clamp(20px,4vw,58px);margin:0}.score{font-size:clamp(25px,5vw,74px);font-weight:1000;color:#ffd43b}.middle{background:linear-gradient(135deg,#111,#303030);border-color:#888}.middle strong{font-size:clamp(18px,3vw,42px)}.middle span{color:#ffd43b}.stats{display:flex;align-items:center;justify-content:space-around;background:#101b31ed;border:2px solid #526d9b;border-radius:8px;font-size:clamp(12px,2vw,27px);font-weight:900}.stats b{color:#ffd43b}.players{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1%}.player{border:2px solid #ffc52f;border-radius:12px;background:linear-gradient(145deg,#151c2aee,#182d4eee);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2%;min-width:0}.player:nth-child(2){border-color:#25e5a0}.player small{font-size:clamp(11px,1.4vw,20px);color:#a9c7f5}.player h2{font-size:clamp(14px,2.2vw,32px);margin:5px 0}.player strong{font-size:clamp(23px,3.4vw,50px);color:#ffd43b}.footer{display:grid;grid-template-columns:1fr 1fr;gap:1%}.overs{background:#07152eef;border:2px solid #347fff;border-radius:9px;padding:1%;display:flex;align-items:center;justify-content:center;gap:1%;font-size:clamp(12px,2vw,24px);font-weight:900;flex-wrap:wrap}.ball{background:#151c2b;border:1px solid #aab9d2;border-radius:5px;padding:7px 12px}.four{background:#079b5a}.six{background:#6734c5}.wicket{background:#c3263b}.notice{position:fixed;bottom:4px;left:10px;font:12px Arial;color:#ddd;text-shadow:0 1px 3px #000}
</style></head><body><div class="stage"><div class="header"><div class="team"><h1 id="team1">TEAM 1</h1><div class="score" id="score1">--/--</div><div id="overs1">Overs --</div></div><div class="middle"><strong id="matchState">CRICFUN LIVE</strong><span id="target">MATCH SCOREBOARD</span></div><div class="team"><h1 id="team2">TEAM 2</h1><div class="score" id="score2">--/--</div><div id="overs2">Overs --</div></div></div>
<div class="stats"><span>CRR <b id="crr">--</b></span><span>RRR <b id="rrr">--</b></span><span>PARTNERSHIP <b id="partnership">--</b></span><span>STATUS <b id="status">CONNECTING</b></span></div>
<div class="players"><div class="player"><small>BATTER 1</small><h2 id="bat1">Waiting for data</h2><strong id="bat1score">--</strong></div><div class="player"><small>BATTER 2</small><h2 id="bat2">Waiting for data</h2><strong id="bat2score">--</strong></div><div class="player"><small>BOWLER</small><h2 id="bowler">Waiting for data</h2><strong id="bowlerscore">--</strong></div></div>
<div class="footer"><div class="overs"><span>THIS OVER</span><div id="balls">No ball data</div></div><div class="overs"><span>LAST WICKET</span><div id="lastWicket">--</div></div></div></div><div class="notice" id="notice">CricFun • Waiting for live match feed</div>
<script>
const matchId={{ match_id|tojson }}, el=id=>document.getElementById(id);
function get(o,keys){for(const key of keys){let v=o;for(const part of key.split('.'))v=v==null?null:v[part];if(v!==undefined&&v!==null&&v!=='')return v;}return null}
function put(id,v){if(v!==null&&v!==undefined&&v!=='')el(id).textContent=v}
function render(d){const i=d.matchInfo||{},s=d.scorecard||{},m=s.miniscore||s.miniScore||i.miniscore||{};
put('team1',get(i,['team1.teamName','team1.teamSName'])||'TEAM 1');put('team2',get(i,['team2.teamName','team2.teamSName'])||'TEAM 2');
const cards=s.scoreCard||s.scorecard||s.scoreDetails||[],first=Array.isArray(cards)?cards[0]||{}:{},second=Array.isArray(cards)?cards[1]||{}:{},bat=m.batTeamScore||m.battingScore||first;
const runs=get(bat,['runs','score','teamScore']),wk=get(bat,['wickets','wkts']),ov=get(bat,['overs','over']);if(runs!==null)put('score1',runs+'/'+(wk??0));if(ov!==null)put('overs1','Overs '+ov);
const r2=get(second,['runs','score','teamScore']),w2=get(second,['wickets','wkts']),o2=get(second,['overs','over']);if(r2!==null)put('score2',r2+'/'+(w2??0));if(o2!==null)put('overs2','Overs '+o2);
put('matchState',get(i,['status','state'])||'CRICFUN');put('target',get(m,['target','targetRuns'])?'TARGET '+get(m,['target','targetRuns']):'LIVE SCORE');put('crr',get(m,['crr','currentRunRate'])||'--');put('rrr',get(m,['rrr','requiredRunRate'])||'--');
const p=m.partnerShip||m.partnership||{};put('partnership',(get(p,['runs'])??'--')+' ('+(get(p,['balls'])??'--')+')');
const batters=m.batsmanStrip||m.batsmen||[];if(batters[0]){put('bat1',get(batters[0],['batName','name']));put('bat1score',(get(batters[0],['runs'])??0)+' ('+(get(batters[0],['balls'])??0)+')')}if(batters[1]){put('bat2',get(batters[1],['batName','name']));put('bat2score',(get(batters[1],['runs'])??0)+' ('+(get(batters[1],['balls'])??0)+')')}
const bowl=(m.bowlerStrip||m.bowlers||[])[0];if(bowl){put('bowler',get(bowl,['bowlName','name']));put('bowlerscore',(get(bowl,['wickets'])??0)+'-'+(get(bowl,['runs'])??0)+' ('+(get(bowl,['overs'])??0)+')')}
const recent=get(m,['recentOvsStats','recentOvers','recentBalls']);if(recent){el('balls').innerHTML=String(recent).split(/[ ,]+/).filter(Boolean).slice(-6).map(x=>'<span class="ball '+(x==='4'?'four':x==='6'?'six':x.toUpperCase()==='W'?'wicket':'')+'">'+x+'</span>').join(' ')}
put('lastWicket',get(m,['lastWicket','lastWicketInfo'])||'--');put('status','CONNECTED');put('notice','CricFun • Updated '+new Date().toLocaleTimeString())}
async function refresh(){try{const r=await fetch('/api/overlay-data/'+encodeURIComponent(matchId),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'API request failed');render(d)}catch(e){put('status','API ERROR');put('notice','CricFun • '+e.message)}}refresh();setInterval(refresh,3000);
</script></body></html>
